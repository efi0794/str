<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HoYo Daily Status</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Noto Sans JP",system-ui,sans-serif;background:#070a12;color:#f7f8ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,rgba(76,93,255,.18),transparent 32%),radial-gradient(circle at 90% 20%,rgba(33,217,255,.12),transparent 25%),#070a12}
main{width:min(1040px,calc(100% - 32px));margin:auto;padding:56px 0 80px}
header{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:28px}
.eyebrow,.tag,.vk{letter-spacing:.16em;font-size:12px;color:#8da5ff;font-weight:800}
h1{margin:8px 0 10px;font-size:clamp(42px,8vw,78px);line-height:.95}.lead,.muted,.hint{color:#9299aa}
button{border:1px solid #2a3244;background:#111725;color:#fff;padding:12px 18px;border-radius:14px;cursor:pointer;font-weight:800}
.card,.panel,.coming{border:1px solid rgba(255,255,255,.09);background:rgba(13,18,31,.82);backdrop-filter:blur(20px);border-radius:24px;box-shadow:0 22px 70px rgba(0,0,0,.25)}
.panel{padding:26px}.hidden{display:none!important}.head{display:flex;justify-content:space-between;gap:20px;align-items:start}.card{padding:clamp(22px,4vw,38px)}.head h2{font-size:clamp(26px,4vw,42px);margin:8px 0 6px}
.badge{border-radius:999px;padding:9px 13px;font-size:13px;font-weight:900;background:rgba(75,235,162,.13);color:#6ff0b5;border:1px solid rgba(75,235,162,.28);white-space:nowrap}
.verdict{margin:34px 0;padding:26px;border-radius:20px;background:linear-gradient(135deg,rgba(87,105,255,.16),rgba(25,216,255,.06));border:1px solid rgba(120,140,255,.17);display:grid;gap:6px}
.verdict strong{font-size:clamp(30px,6vw,58px)}.done strong{color:#72efb9}.todo strong{color:#ffd47b}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.stat{min-height:145px;padding:20px;border-radius:18px;background:#0b101c;border:1px solid #1c2435;display:flex;flex-direction:column;gap:9px}.stat span,.stat small{color:#858da0}.stat strong{font-size:30px}
.bar{height:7px;border-radius:999px;background:#20283a;overflow:hidden;margin-top:auto}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6677ff,#4de2ff)}
.foot{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;color:#656d80;font-size:12px;margin-top:22px}.coming{margin-top:16px;padding:22px;display:grid;gap:5px;opacity:.8}.coming span{color:#7e879a;font-size:11px;letter-spacing:.14em;font-weight:800}.coming p{color:#747d90;margin:0}.error{border-color:rgba(255,95,95,.35)}
@media(max-width:700px){header{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr}.head{flex-direction:column}}
</style>
</head>
<body>
<main>
<header><div><p class="eyebrow">HOYOVERSE STATUS CONSOLE</p><h1>今日、やった？</h1><p class="lead">ログイン認証・デイリー・開拓力を1画面で確認。</p></div><button id="refresh">↻ 更新</button></header>
<section id="loading" class="panel">HoYoLABと通信中…</section>
<section id="error" class="panel error hidden"><h2 id="errorTitle">取得できません</h2><p id="errorText"></p><p class="hint">READMEの設定方法を確認してください。</p></section>
<section id="dashboard" class="hidden">
<article class="card">
<div class="head"><div><span class="tag">HONKAI: STAR RAIL</span><h2>崩壊：スターレイル</h2><p id="uid" class="muted"></p></div><div class="badge">● 認証OK</div></div>
<div id="verdict" class="verdict"><span class="vk">TODAY</span><strong id="verdictText">確認中</strong><span id="verdictSub"></span></div>
<div class="grid">
<div class="stat"><span>デイリー訓練</span><strong id="daily">--</strong><div class="bar"><i id="dailyBar"></i></div></div>
<div class="stat"><span>開拓力</span><strong id="stamina">--</strong><div class="bar"><i id="staminaBar"></i></div></div>
<div class="stat"><span>HoYoLABログボ</span><strong id="checkin">--</strong><small id="checkinSub"></small></div>
<div class="stat"><span>派遣</span><strong id="expedition">--</strong><small id="expeditionSub"></small></div>
</div>
<div class="foot"><span id="updated"></span><span>認証Cookieはブラウザへ送信しません</span></div>
</article>
<article class="coming"><span>COMING NEXT</span><strong>原神 / ゼンレスゾーンゼロ</strong><p>同じカード形式で追加できます。</p></article>
</section>
</main>
<script>
const q=id=>document.getElementById(id), pct=(a,b)=>b>0?Math.min(100,Math.max(0,a/b*100)):0;
async function load(){
 q("loading").classList.remove("hidden");q("dashboard").classList.add("hidden");q("error").classList.add("hidden");
 try{
  const r=await fetch("/api/status",{cache:"no-store"}),d=await r.json();
  if(!r.ok||!d.ok)throw d;
  const g=d.game;
  q("uid").textContent="UID: "+g.uid;
  if(g.daily.completed===true){q("verdict").className="verdict done";q("verdictText").textContent="デイリー完了";q("verdictSub").textContent="今日はもう安心。"}
  else if(g.daily.completed===false){q("verdict").className="verdict todo";q("verdictText").textContent="まだ終わってない";q("verdictSub").textContent="デイリー訓練が残っています。"}
  else{q("verdict").className="verdict";q("verdictText").textContent="認証OK";q("verdictSub").textContent="現在のAPI応答ではデイリー訓練スコアを判定できません。"}
  if(g.daily.current!==null){q("daily").textContent=g.daily.current+" / "+g.daily.max;q("dailyBar").style.width=pct(g.daily.current,g.daily.max)+"%"}else q("daily").textContent="取得対象外";
  q("stamina").textContent=g.stamina.current+" / "+g.stamina.max;q("staminaBar").style.width=pct(g.stamina.current,g.stamina.max)+"%";
  const c=g.hoyolabCheckIn;q("checkin").textContent=c?.signedToday===true?"受取済み":c?.signedToday===false?"未受取":"確認不可";q("checkinSub").textContent=c?.totalSignDays!=null?"今月 "+c.totalSignDays+"日":"HoYoLABログインボーナス";
  const ex=g.expeditions||[],fin=ex.filter(x=>/finished/i.test(x.status)).length;q("expedition").textContent=ex.length?fin+" / "+ex.length+" 完了":"0件";q("expeditionSub").textContent=fin?"受け取り可能な派遣があります":"進行中";
  q("updated").textContent="最終更新: "+new Date(d.fetchedAt).toLocaleString("ja-JP");
  q("loading").classList.add("hidden");q("dashboard").classList.remove("hidden");
 }catch(e){q("loading").classList.add("hidden");q("error").classList.remove("hidden");q("errorTitle").textContent=e?.error?.kind==="auth"?"HoYoLAB認証が切れています":"ステータスを取得できません";q("errorText").textContent=e?.error?.message||"サーバーに接続できません。"}
}
q("refresh").onclick=load;load();
</script>
</body>
</html>
